name: repo-meta (one shot)
# 一次性：把仓库 About 描述从旧口号改成新口号。跑完请删除本文件。
on:
  push:
    paths: ['ops/update-repo-meta']
permissions:
  contents: read
  metadata: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: patch description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" \
            -d '{"description":"Every command in a sandbox. Every run on the record. Kernel-level isolation, replayable event logs, recipe assertions.","homepage":"https://unitai.site/open"}' \
            | head -c 400
