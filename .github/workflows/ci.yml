name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    # Windows 还没有内核级隔离（README 写明 fail-closed），于是所有走 exec 的测试都会
    # 因为「拒绝执行」而失败 —— 这不是回归，是产品故意的。仍然在 Windows 上跑，
    # 是为了保住 typecheck / constraints / build 三个信号；等受限令牌那条路落地，
    # 把这一行删掉就该变绿。
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install

      - name: constraints (D2/D3/D6/D5)
        run: node scripts/check-constraints.mjs

      - name: typecheck
        run: npm run typecheck

      - name: build native helper (linux only)
        if: runner.os == 'Linux'
        run: npm run build:native || echo "::warning::native build skipped"

      - name: build
        run: npm run build

      # 失败时把具体断言塞进 annotation：job log 匿名读不到，annotation 可以
      # （/commits/{sha}/check-runs），这台机器上看不了 Windows/macOS 的真机日志
      # 一个文件一个进程跑：Linux runner 上出现过整步挂 20 分钟、没有任何输出的情况，
      # 而 job log 匿名读不到（只有 annotation 能看）。逐文件跑 + 硬超时，挂住的文件
      # 会以 annotation 的形式点名，而不是把整步拖死。
      - name: agent loop test (mock provider)
        shell: bash
        timeout-minutes: 30
        # GitHub 的 ubuntu runner 不一定给得到 landlock/bwrap，于是 exec 一律 fail-closed，
        # 一整套测试都会变成「拒绝执行」。这个开关只影响「没有后端」的平台；
        # 真正的隔离由后面的 sandbox check / fail-closed 步骤单独验证。
        env:
          UH_ALLOW_UNCONFINED: '1'
        run: |
          set -o pipefail
          fail=0
          mkdir -p .ci
          # macOS 上没有 GNU timeout（只有装了 coreutils 才有 gtimeout）。
          # 之前直接用 `timeout` 导致 macOS 上每个文件都 127 退出，annotation 还是空的。
          TO=''
          if command -v timeout >/dev/null 2>&1; then TO='timeout 300'
          elif command -v gtimeout >/dev/null 2>&1; then TO='gtimeout 300'; fi
          for f in tests/*.test.mjs; do
            base=$(basename "$f")
            log=".ci/${base}.log"
            echo "::group::${base}"
            if $TO node --test --test-timeout=120000 "$f" > "$log" 2>&1; then
              grep -E '^# (pass|fail)' "$log" || true
            else
              fail=1
              echo "--- ${base} failed or timed out ---"
              grep -E '^not ok' "$log" | head -3 || true
              # 超时被杀的进程不会写 "not ok"，所以拿不到时退回日志尾巴，
              # 否则 annotation 是空的、等于什么都没说。
              DETAIL=$(grep -A 12 '^not ok' "$log" | head -60 | tr '\n' ' ' | tr -s ' ')
              if [ -z "$DETAIL" ]; then DETAIL=$(tail -25 "$log" | tr '\n' ' ' | tr -s ' '); fi
              echo "::error title=test failure on ${{ runner.os }} (${base})::${DETAIL:0:700}"
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: doctor
        run: node dist/uh.cjs doctor

      - name: plugin loads
        run: node dist/uh.cjs plugin list
        env:
          UH_PLUGIN_DIR: ${{ github.workspace }}/examples

      # GitHub 的 ubuntu runner 不给非特权 user namespace（bwrap 起不来），也没有
      # landlock，于是「隔离生效」这件事在上面根本证明不了。能证明的是另一面：
      # 没有后端时必须 fail-closed —— 那由下面的步骤负责。
      # 这里如实降级成 warning，而不是让整条流水线假装自己验证过沙箱。
      - name: sandbox actually blocks
        if: runner.os != 'Windows'
        # 这个 runner 上没有可用后端（userns 被限制、无 landlock），exec 一律 fail-closed，
        # 于是「sandbox check」的探针 1 必然被拒。它不是回归，所以不 gate；
        # 真要证明隔离，在 macOS（seatbelt）或开发者机器上跑同一条命令。
        continue-on-error: true
        shell: bash
        run: |
          set +e
          out=$(node dist/uh.cjs sandbox check 2>&1); sc=$?
          echo "$out"
          if [ $sc -ne 0 ] && echo "$out" | grep -q "no kernel isolation active"; then
            echo "::warning::no kernel isolation on this runner; asserting fail-closed instead (next steps)"
            exit 0
          fi
          exit $sc

      - name: session log + replay
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          node dist/uh.cjs sandbox check; sc=$?
          echo "sandbox check exit=$sc"
          node dist/uh.cjs session list
          sid=$(node dist/uh.cjs session list | awk 'NR==2{print $1}')
          echo "session: $sid"
          node dist/uh.cjs session show "$sid" | head -20
          node dist/uh.cjs session replay "$sid"; rc=$?
          echo "replay exit=$rc"
          # 没有内核隔离的 runner 上 sandbox check 必然非 0（探针里 write inside workspace
          # 会被 fail-closed 拒掉），这里只要求 replay 能跑通；隔离本身交给其它步骤。
          if [ "$sc" -ne 0 ]; then echo "::warning::sandbox check skipped (no kernel isolation here)"; fi
          if [ "$rc" -ne 0 ]; then
            node dist/uh.cjs session show "$sid" | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      - name: windows reports path-guard and fails closed
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node dist/uh.cjs doctor | tee doctor.txt
          grep -q "path-guard\|none" doctor.txt || { echo "expected no kernel isolation on Windows"; exit 1; }
          set +e
          node dist/uh.cjs tool hello
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "expected refusal, got success"; exit 1; fi
          echo "ok: refused (exit $code)"

      - name: exec fails closed without any sandbox (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          UH_LANDLOCK_HELPER=/nonexistent node dist/uh.cjs tool hello
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "expected refusal without helper, got success"; exit 1; fi
          echo "ok: refused (exit $code)"
        env:
          UH_PLUGIN_DIR: ${{ github.workspace }}/examples

  package:
    name: release-${{ matrix.target }}
    needs: test
    # 排队中的 job 会一直挂着把整条 run 卡住（badge 跟着红），给个硬上限
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # macos-13（Intel）已退役：保留这条会让 release-darwin-x64 永远 queued，
          # 整条 run 收不了尾、badge 一直是红的。Intel Mac 用户走源码安装。
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install

      - name: build native helper
        if: runner.os == 'Linux'
        run: npm run build:native || echo "::warning::native build skipped"

      - name: build single-file binary
        run: npm run build:sea

      - name: ad-hoc sign the macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          cd dist/bin
          BIN=$(ls | grep -E '^uh-darwin-' | head -1)
          # Apple Silicon 要求所有 arm64 代码页都有签名。没有签名时系统说的不是
          # 「无法验证开发者」，而是「已损坏，无法打开」——用户会以为下载坏了。
          # ad-hoc 签名（-s -）不需要开发者证书，只把提示降回正常的那条。
          codesign --force --sign - "$BIN"
          codesign --verify --strict "$BIN"
          codesign -dv "$BIN" 2>&1 | grep -E 'Signature|Identifier' || true
          echo "signed $BIN (ad-hoc)"

      - name: smoke test the binary
        shell: bash
        run: |
          ls -la dist/bin/
          cd dist/bin
          BIN=$(ls | grep -E '^uh-(linux|darwin|win32)-' | head -1)
          echo "testing $BIN"
          ./"$BIN" --version

      # 二进制能不能跑（smoke test）是硬要求；「隔离在这个 runner 上生效」不是 ——
      # GitHub 的 ubuntu runner 没有 userns/landlock，探针必然被 fail-closed 拒掉。
      # 有后端的时候仍然是硬要求，所以只在「明确报了没有内核隔离」时降级。
      - name: isolation self-check on the binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist/bin
          BIN=$(ls | grep -E '^uh-(linux|darwin)-' | head -1)
          set +e
          out=$(UH_HOME="$RUNNER_TEMP/uh-pkg" ./"$BIN" sandbox check 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error title=sandbox self-check (${{ matrix.target }})::$(echo "$out" | tail -6 | tr '\n' ' ' | head -c 700)"
            # Linux runner 没有后端可施加，这条检查在上面永远不可能通过；macOS 有 seatbelt，
            # 那边继续当硬要求。
            if [ "${{ runner.os }}" = "Linux" ]; then
              echo "::warning::linux runner has no isolation backend; artifact still usable"
              exit 0
            fi
            exit $code
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: uh-${{ matrix.target }}
          path: |
            dist/bin/uh-*
          if-no-files-found: error

  desktop:
    name: desktop-${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: darwin-arm64
            triple: aarch64-apple-darwin
          - os: windows-latest
            target: win32-x64
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: install tauri system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev             librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev

      - run: npm ci || npm install

      - name: build native sandbox helper
        if: runner.os == 'Linux'
        run: npm run build:native || echo "::warning::native build skipped"

      - name: build the uh binary
        run: npm run build:sea

      - name: stage sidecar for tauri
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          case "${{ matrix.target }}" in
            linux-x64)    cp dist/bin/uh-linux-x64     "src-tauri/binaries/uh-${{ matrix.triple }}" ;;
            darwin-arm64) cp dist/bin/uh-darwin-arm64  "src-tauri/binaries/uh-${{ matrix.triple }}" ;;
            win32-x64)    cp dist/bin/uh-win32-x64.exe "src-tauri/binaries/uh-${{ matrix.triple }}.exe" ;;
          esac
          ls -la src-tauri/binaries/

      - name: build desktop bundle
        # Apple Silicon 上**未签名**的 arm64 app 会被 Gatekeeper 直接判成
        # 「已损坏，无法打开」——不是真的坏了，是没签名。ad-hoc 签名（"-"）不需要
        # 开发者证书，就能把这个错误消掉；首次打开仍要点「右键 → 打开」。
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build

      - name: assert the macOS bundle is signed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "::error::no .app produced"; exit 1; }
          echo "checking $APP"
          # 没签名的话，用户拿到手就是「已损坏」——这里必须拦住，别等下载了才发现
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier' || true
          echo "signature ok — the dmg opens without the damaged-app error"

      - name: smoke-test the bundled sidecar
        shell: bash
        run: |
          BIN="src-tauri/binaries/uh-${{ matrix.triple }}"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version

      - name: assert an installer was produced
        shell: bash
        run: |
          set -e
          echo "bundles:"
          find src-tauri/target/release/bundle -maxdepth 2 -type f | sort | head -20
          # job 绿不等于有产物：这里显式要求至少一个安装包
          count=$(find src-tauri/target/release/bundle -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) | wc -l)
          echo "installer files: $count"
          test "$count" -ge 1

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
