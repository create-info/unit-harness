name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install

      - name: constraints (D2/D3/D6/D5)
        run: node scripts/check-constraints.mjs

      - name: typecheck
        run: npm run typecheck

      - name: build native helper (linux only)
        if: runner.os == 'Linux'
        run: npm run build:native || echo "::warning::native build skipped"

      - name: build
        run: npm run build

      # 失败时把具体断言塞进 annotation：job log 匿名读不到，annotation 可以
      # （/commits/{sha}/check-runs），这台机器上看不了 Windows/macOS 的真机日志
      - name: agent loop test (mock provider)
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            echo "--- failing tests ---"
            grep -E "^not ok|^# (pass|fail)" test.log || true
            DETAIL=$(grep -A 14 "^not ok" test.log | head -80 | tr '\n' ' ' | tr -s ' ')
            echo "::error title=test failure on ${{ runner.os }}::${DETAIL:0:800}"
            exit 1
          fi

      - name: doctor
        run: node dist/uh.cjs doctor

      - name: plugin loads
        run: node dist/uh.cjs plugin list
        env:
          UH_PLUGIN_DIR: ${{ github.workspace }}/examples

      - name: sandbox actually blocks
        if: runner.os != 'Windows'
        run: node dist/uh.cjs sandbox check

      - name: session log + replay
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          node dist/uh.cjs sandbox check; sc=$?
          echo "sandbox check exit=$sc"
          node dist/uh.cjs session list
          sid=$(node dist/uh.cjs session list | awk 'NR==2{print $1}')
          echo "session: $sid"
          node dist/uh.cjs session show "$sid" | head -20
          node dist/uh.cjs session replay "$sid"; rc=$?
          echo "replay exit=$rc"
          if [ "$sc" -ne 0 ] || [ "$rc" -ne 0 ]; then
            node dist/uh.cjs session show "$sid" | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      - name: windows reports path-guard and fails closed
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node dist/uh.cjs doctor | tee doctor.txt
          grep -q "path-guard\|none" doctor.txt || { echo "expected no kernel isolation on Windows"; exit 1; }
          set +e
          node dist/uh.cjs tool hello
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "expected refusal, got success"; exit 1; fi
          echo "ok: refused (exit $code)"

      - name: exec fails closed without any sandbox (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          UH_LANDLOCK_HELPER=/nonexistent node dist/uh.cjs tool hello
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "expected refusal without helper, got success"; exit 1; fi
          echo "ok: refused (exit $code)"
        env:
          UH_PLUGIN_DIR: ${{ github.workspace }}/examples

  package:
    name: release-${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-13
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install

      - name: build native helper
        if: runner.os == 'Linux'
        run: npm run build:native || echo "::warning::native build skipped"

      - name: build single-file binary
        run: npm run build:sea

      - name: smoke test the binary
        shell: bash
        run: |
          ls -la dist/bin/
          cd dist/bin
          BIN=$(ls | grep -E '^uh-(linux|darwin|win32)-' | head -1)
          echo "testing $BIN"
          ./"$BIN" --version

      - name: isolation self-check on the binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist/bin
          BIN=$(ls | grep -E '^uh-(linux|darwin)-' | head -1)
          UH_HOME="$RUNNER_TEMP/uh-pkg" ./"$BIN" sandbox check

      - uses: actions/upload-artifact@v4
        with:
          name: uh-${{ matrix.target }}
          path: |
            dist/bin/uh-*
          if-no-files-found: error

  desktop:
    name: desktop-${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: darwin-arm64
            triple: aarch64-apple-darwin
          - os: windows-latest
            target: win32-x64
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: install tauri system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev             librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev

      - run: npm ci || npm install

      - name: build native sandbox helper
        if: runner.os == 'Linux'
        run: npm run build:native || echo "::warning::native build skipped"

      - name: build the uh binary
        run: npm run build:sea

      - name: stage sidecar for tauri
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          case "${{ matrix.target }}" in
            linux-x64)    cp dist/bin/uh-linux-x64     "src-tauri/binaries/uh-${{ matrix.triple }}" ;;
            darwin-arm64) cp dist/bin/uh-darwin-arm64  "src-tauri/binaries/uh-${{ matrix.triple }}" ;;
            win32-x64)    cp dist/bin/uh-win32-x64.exe "src-tauri/binaries/uh-${{ matrix.triple }}.exe" ;;
          esac
          ls -la src-tauri/binaries/

      - name: build desktop bundle
        # Apple Silicon 上**未签名**的 arm64 app 会被 Gatekeeper 直接判成
        # 「已损坏，无法打开」——不是真的坏了，是没签名。ad-hoc 签名（"-"）不需要
        # 开发者证书，就能把这个错误消掉；首次打开仍要点「右键 → 打开」。
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build

      - name: assert the macOS bundle is signed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "::error::no .app produced"; exit 1; }
          echo "checking $APP"
          # 没签名的话，用户拿到手就是「已损坏」——这里必须拦住，别等下载了才发现
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier' || true
          echo "signature ok — the dmg opens without the damaged-app error"

      - name: smoke-test the bundled sidecar
        shell: bash
        run: |
          BIN="src-tauri/binaries/uh-${{ matrix.triple }}"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version

      - name: assert an installer was produced
        shell: bash
        run: |
          set -e
          echo "bundles:"
          find src-tauri/target/release/bundle -maxdepth 2 -type f | sort | head -20
          # job 绿不等于有产物：这里显式要求至少一个安装包
          count=$(find src-tauri/target/release/bundle -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) | wc -l)
          echo "installer files: $count"
          test "$count" -ge 1

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
