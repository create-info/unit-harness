name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install

      - name: constraints (D2/D3/D6/D5)
        run: node scripts/check-constraints.mjs

      - name: typecheck
        run: npm run typecheck

      - name: build native helper (linux only)
        if: runner.os == 'Linux'
        run: npm run build:native || echo "::warning::native build skipped"

      - name: build
        run: npm run build

      - name: doctor
        run: node dist/uh.cjs doctor

      - name: plugin loads
        run: node dist/uh.cjs plugin list
        env:
          UH_PLUGIN_DIR: ${{ github.workspace }}/examples

      - name: sandbox actually blocks
        if: runner.os != 'Windows'
        run: node dist/uh.cjs sandbox check

      - name: session log + replay
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          node dist/uh.cjs sandbox check; sc=$?
          echo "sandbox check exit=$sc"
          node dist/uh.cjs session list
          sid=$(node dist/uh.cjs session list | awk 'NR==2{print $1}')
          echo "session: $sid"
          node dist/uh.cjs session show "$sid" | head -20
          node dist/uh.cjs session replay "$sid"; rc=$?
          echo "replay exit=$rc"
          if [ "$sc" -ne 0 ] || [ "$rc" -ne 0 ]; then
            node dist/uh.cjs session show "$sid" | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      - name: windows reports path-guard and fails closed
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node dist/uh.cjs doctor | tee doctor.txt
          grep -q "path-guard\|none" doctor.txt || { echo "expected no kernel isolation on Windows"; exit 1; }
          set +e
          node dist/uh.cjs tool hello
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "expected refusal, got success"; exit 1; fi
          echo "ok: refused (exit $code)"

      - name: exec fails closed without any sandbox (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          UH_LANDLOCK_HELPER=/nonexistent node dist/uh.cjs tool hello
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "expected refusal without helper, got success"; exit 1; fi
          echo "ok: refused (exit $code)"
        env:
          UH_PLUGIN_DIR: ${{ github.workspace }}/examples
