<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UnitHarness</title>
<style>
  html,body{height:100%;margin:0;background:#0f1115;color:#8b95a7;
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  .ring{width:26px;height:26px;border-radius:50%;border:2px solid #242b36;border-top-color:#7aa2f7;
    animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="ring"></div>
  <div>starting the local engine…</div>
</body>
</html>
